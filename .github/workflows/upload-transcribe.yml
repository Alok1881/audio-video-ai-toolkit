name: Whisper Upload Transcription
run-name: Transcribe ${{ inputs.audio_file }} (${{ inputs.language }})

on:
  workflow_dispatch:
    inputs:
      audio_file:
        type: string
        description: 'Audio file path in the repo (for example: sample-0.mp3)'
        required: true
        default: sample-0.mp3
      language:
        type: choice
        description: 'Spoken language in the audio'
        required: true
        default: en
        options:
          - en
          - fr
          - es
          - de
          - hi
      model:
        type: choice
        description: 'Whisper model size'
        required: true
        default: small
        options:
          - tiny
          - base
          - small
          - medium
          - large

jobs:
  transcribe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate input file exists
        run: |
          test -f "${{ inputs.audio_file }}" || { echo "Audio file not found: ${{ inputs.audio_file }}"; exit 1; }

      - name: Run transcription
        run: |
          python audio_to_text.py "${{ inputs.audio_file }}" -o transcript.txt -m "${{ inputs.model }}" -l "${{ inputs.language }}"

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcript
          path: transcript.txt
